name: Deploy Koda Server

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: koda-logtech
  REGION: southamerica-east1
  SERVICE_NAME: koda-server
  GAR_LOCATION: southamerica-east1
  GAR_REPOSITORY: cloud-run-source-deploy

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log Deployment Info
        run: |
          echo "=========================================="
          echo "🌿 Branch selecionada: ${{ github.ref_name }}"
          echo "🎯 Último commit (HEAD): ${{ github.sha }}"
          echo "📝 Mensagem do commit:"
          git log -1 --pretty=format:"%h - %s (%an)"
          echo ""
          echo "=========================================="

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Determine Image Tag
        id: vars
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Imagem alvo: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_uri }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.vars.outputs.image_uri }}

      - name: Deployment Summary
        run: |
          echo "🚀 Deploy finalizado com sucesso!"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🎯 Commit: ${{ github.sha }}"
          echo "🔗 URL do Cloud Run: ${{ steps.deploy.outputs.url }}"
